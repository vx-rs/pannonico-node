name: Publish Pannonico launcher

on:
  repository_dispatch:
    types: [binaries-published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact wrapper version to publish
        required: true
        type: string
      binary_repository_tag:
        description: Matching pannonico-binaries tag
        required: true
        type: string

concurrency:
  group: pannonico-wrapper-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

env:
  BINARY_REPOSITORY_TAG: ${{ github.event.client_payload.binaryRepositoryTag || inputs.binary_repository_tag }}
  VERSION: ${{ github.event.client_payload.version || inputs.version }}

jobs:
  validate-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, package: "@vx.rs/pannonico-bin-linux-x64" }
          - { runner: ubuntu-24.04-arm, package: "@vx.rs/pannonico-bin-linux-arm64" }
          - { runner: macos-15-intel, package: "@vx.rs/pannonico-bin-darwin-x64" }
          - { runner: macos-14, package: "@vx.rs/pannonico-bin-darwin-arm64" }
          - { runner: windows-latest, package: "@vx.rs/pannonico-bin-win32-x64" }
          - { runner: windows-11-arm, package: "@vx.rs/pannonico-bin-win32-arm64" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate immutable release inputs
        shell: bash
        env:
          BINARY_TAG: ${{ env.BINARY_REPOSITORY_TAG }}
          TARGET_PACKAGE: ${{ matrix.package }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [[ "$BINARY_TAG" != "v$VERSION" ]]; then
            echo "::error::Binary tag does not match v$VERSION."
            exit 1
          fi
          git ls-remote --exit-code --tags https://github.com/vx-rs/pannonico-binaries.git "refs/tags/$BINARY_TAG"
          npm view "$TARGET_PACKAGE@$VERSION" version --registry=https://registry.npmjs.org
          npm view "@vx.rs/pannonico-wasi@$VERSION" version --registry=https://registry.npmjs.org
      - name: Prepare exact wrapper and lockfile
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          node scripts/prepare-release.ts "$VERSION"
          npm install --package-lock-only --ignore-scripts --loglevel error
          npm ci --ignore-scripts --omit=optional --loglevel error
          npm test
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Test registry-backed native and forced-WASI consumers
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: node scripts/test-registry-consumer.ts --version "$VERSION" --wrapper "$RUNNER_TEMP/vx.rs-pannonico-$VERSION.tgz"

  publish:
    needs: validate-consumer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Confirm wrapper version is unpublished
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set +e
          output="$(npm view "@vx.rs/pannonico@$VERSION" version --registry=https://registry.npmjs.org 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "::error::@vx.rs/pannonico@$VERSION is already published."
            exit 1
          fi
          if [[ "$output" != *"E404"* ]]; then
            echo "$output"
            echo "::error::Unable to prove that the wrapper version is unpublished."
            exit 1
          fi
      - name: Prepare, verify, commit, and tag exact metadata
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          node scripts/prepare-release.ts "$VERSION"
          npm install --package-lock-only --ignore-scripts --loglevel error
          npm ci --ignore-scripts --omit=optional --loglevel error
          npm run format:check
          npm run lint
          npm test
          npm run pack:check
          git config user.name "vx-rs release automation"
          git config user.email "release-automation@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "release: prepare wrapper v$VERSION"
          fi
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            if [[ "$(git rev-list -n 1 "v$VERSION")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Existing v$VERSION tag does not identify the prepared wrapper commit."
              exit 1
            fi
          else
            git tag "v$VERSION"
          fi
          git push --atomic origin HEAD:master "v$VERSION"
      - name: Publish wrapper with trusted publishing
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          dist_tag=latest
          if [[ "$VERSION" == *-* ]]; then dist_tag=next; fi
          npm publish --provenance --access public --tag "$dist_tag"

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Wait for and test the exact published launcher
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          for attempt in {1..12}; do
            if npm view "@vx.rs/pannonico@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              node scripts/test-registry-consumer.ts \
                --version "$VERSION" --package "@vx.rs/pannonico@$VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::@vx.rs/pannonico@$VERSION did not become available in time."
          exit 1
