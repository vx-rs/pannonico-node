version: 1

richMarkdown:
  enabled: true

vite:
  root: .
  output: .pannonico/vite
  manifest: .vite/manifest.json
  manifestFormat: auto
  publicPath: /
  entries:
    app: src/app.ts
  resources:
    accentGrid: src/accent-grid.svg
  buildCommand:
    executable: node
    arguments: [run-vite.mjs, build]
  devCommand:
    executable: node
    arguments: [run-vite.mjs, --host, 127.0.0.1]
  devServer: http://127.0.0.1:5173
